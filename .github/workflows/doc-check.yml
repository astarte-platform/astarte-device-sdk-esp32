name: Documentation checks

on:
  pull_request:
    paths:
    - 'README.md'
    - 'doc/**'
    - 'include/**'
    - '.github/workflows/doc-check.yml'

env:
  DOXYGEN_VERSION: 1.12.0

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: check-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: astarte-device-sdk-esp32
    - name: Install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build graphviz
    - name: Install doxygen
      working-directory: astarte-device-sdk-esp32
      shell: bash
      run: |
        wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
        echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH
    - name: Build Docs
      working-directory: ./astarte-device-sdk-esp32/doc
      run: doxygen astarte-device-sdk-esp32.doxy
    - name: Upload HTML documentation
      uses: actions/upload-artifact@v4
      with:
        name: docs_html
        path: astarte-device-sdk-esp32/doc/out/html
